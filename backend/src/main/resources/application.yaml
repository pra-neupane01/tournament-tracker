server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: esports-management-system

  datasource:
    url: ${ESPORTS_DB_URL:jdbc:postgresql://localhost:5432/esports_management_app}
    username: ${ESPORTS_DB_USERNAME:postgres}
    password: ${ESPORTS_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  files:
    storage-path: ${FILE_STORAGE_PATH:./data/uploads}

  security:
    jwt:
      secret: ${JWT_SECRET:change-this-development-secret-before-production}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

logging:
  level:
    root: INFO
