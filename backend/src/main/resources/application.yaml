server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: esports-management-system

  datasource:
    url: ${DB_URL:${ESPORTS_DB_URL:jdbc:postgresql://localhost:5432/esports_management_app}}
    username: ${DB_USERNAME:${ESPORTS_DB_USERNAME:postgres}}
    password: ${DB_PASSWORD:${ESPORTS_DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  files:
    storage-path: ${FILE_STORAGE_PATH:./data/uploads}

  security:
    jwt:
      secret: ${JWT_SECRET:change-this-development-secret-before-production}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  auth:
    # Enable this explicitly when SMTP is configured. Local development must
    # not fail registration because no mail server is running.
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:false}
    verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:5173/verify-email}
    verification-token-expiration-hours: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION_HOURS:24}

logging:
  level:
    root: INFO
